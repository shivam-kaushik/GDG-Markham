    - generic [ref=e478]:
      - region [ref=e479]:
        - generic [ref=e480]:
          - paragraph [ref=e481]: TodoMarkham
          - heading "About TodoMarkham" [level=1] [ref=e484]
          - paragraph [ref=e485]: One calm place to find events in Markham that fit your language, your body, your budget and the way you get there.
          - generic [ref=e486]:
            - link "Find events for me" [ref=e487] [cursor=pointer]:
              - /url: "#/welcome"
            - link "Browse all events" [ref=e491] [cursor=pointer]:
              - /url: "#/"
      - region [ref=e498]:
        - heading "The problem we saw" [level=2] [ref=e499]
        - paragraph [ref=e500]: Events in Markham are scattered across Eventbrite, Luma, the City, libraries and community groups. Most listings do not say whether there are steps, whether it is loud, whether lights flash, or whether the bus runs when it ends. Many sites speak only English. People end up guessing, or staying home.
        - paragraph [ref=e501]: An illustrative journey, not a measured statistic.
        - generic [ref=e502]:
          - paragraph [ref=e503]: Today, with a typical listing site
          - list [ref=e504]:
            - listitem [ref=e505]:
              - generic [ref=e510]: "1"
              - generic [ref=e511]: You search a listing site, usually in English
            - listitem [ref=e512]:
              - generic [ref=e517]: "2"
              - generic [ref=e518]: The listing says little about access, transit or noise
            - listitem [ref=e519]:
              - generic [ref=e524]: "3"
              - generic [ref=e525]: You call, message or visit to find out
            - listitem [ref=e526]:
              - generic [ref=e530]: "4"
              - generic [ref=e531]: You give up, or arrive and it does not work for you
        - generic [ref=e532]:
          - paragraph [ref=e533]: With TodoMarkham
          - list [ref=e534]:
            - listitem [ref=e535]:
              - generic [ref=e540]: "1"
              - generic [ref=e541]: You type or speak in your language
            - listitem [ref=e542]:
              - generic [ref=e546]: "2"
              - generic [ref=e547]: Maple shows what it understood. You can remove anything wrong.
            - listitem [ref=e548]:
              - generic [ref=e553]: "3"
              - generic [ref=e554]: Search tools find real events. Plain code ranks them for you.
            - listitem [ref=e555]:
              - generic [ref=e559]: "4"
              - generic [ref=e560]: You see picks with reasons, and access marked Confirmed, AI-estimated or Unknown
        - paragraph [ref=e561]:
          - link "See the evidence and sources on our Mission page" [ref=e562] [cursor=pointer]:
            - /url: "#/mission"
      - region [ref=e563]:
        - heading "How TodoMarkham helps" [level=2] [ref=e564]
        - list [ref=e565]:
          - listitem [ref=e566]:
            - heading "Everything in one place" [level=3] [ref=e571]
            - paragraph [ref=e572]: Events from many sources, each showing exactly where it comes from and its rating there.
          - listitem [ref=e573]:
            - heading "Access you can trust" [level=3] [ref=e577]
            - paragraph [ref=e578]: Every access detail says whether the host confirmed it, we estimated it, or nobody knows yet. "Not known" never means "no".
          - listitem [ref=e579]:
            - heading "In your language" [level=3] [ref=e583]
            - paragraph [ref=e584]: English, Cantonese, Mandarin, Tamil and Persian, including right-to-left reading. Speak or type to Maple in your language.
          - listitem [ref=e585]:
            - heading "Getting there, with or without a car" [level=3] [ref=e590]
            - paragraph [ref=e591]: See travel time by car, bus or on foot, the nearest stop, and whether service runs at the start time.
          - listitem [ref=e592]:
            - heading "Maple, your event guide" [level=3] [ref=e597]
            - paragraph [ref=e598]: Tell Maple what you enjoy, by voice or text. Maple picks events and explains why in plain words. The score comes from clear rules, not guesswork.
          - listitem [ref=e599]:
            - heading "A real community" [level=3] [ref=e604]
            - paragraph [ref=e605]: Ask hosts questions before you go, read honest reviews from people who attended, and help each other in the community forum.
      - region [ref=e606]:
        - heading "Who it is for" [level=2] [ref=e607]
        - list [ref=e608]:
          - listitem [ref=e609]:
            - generic [ref=e612]: Seniors who want large, clear pages and seated, calm events.
          - listitem [ref=e613]:
            - generic [ref=e616]: Newcomers who want to practise a language and meet neighbours.
          - listitem [ref=e617]:
            - generic [ref=e620]: People with disabilities who need to know before they go, by type of need.
          - listitem [ref=e621]:
            - generic [ref=e624]: Families and caregivers planning a day that works for everyone.
          - listitem [ref=e625]:
            - generic [ref=e628]: Hosts and volunteers who want to be honest about access and get the right people.
