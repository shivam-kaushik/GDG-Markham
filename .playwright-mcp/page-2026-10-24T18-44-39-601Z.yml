        - heading "The problem, in numbers" [level=2] [ref=e50]
        - paragraph [ref=e51]: Markham is mostly immigrant, multilingual and ageing, and disability is common. Event listings are mostly English, rarely say whether a venue works for you, and rank by popularity.
