      - region [ref=e743]:
        - heading "Our promises" [level=2] [ref=e744]
        - list [ref=e745]:
          - listitem [ref=e746]: We label what we know. Confirmed, estimated and unknown are never mixed up.
          - listitem [ref=e747]: Your answers stay on your device in this prototype. They are never used for ads, and you can delete them at any time.
