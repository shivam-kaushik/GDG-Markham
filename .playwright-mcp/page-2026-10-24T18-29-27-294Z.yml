          - heading "关于 TodoMarkham" [level=1] [ref=e106]
          - paragraph [ref=e107]: 一个安静的地方，帮您找到适合您的语言、身体状况、预算和出行方式的万锦活动。
          - generic [ref=e108]:
            - link "帮我找活动" [ref=e109] [cursor=pointer]:
              - /url: "#/welcome"
            - link "浏览全部活动" [ref=e113] [cursor=pointer]:
              - /url: "#/"
      - region [ref=e120]:
        - heading "我们看到的问题" [level=2] [ref=e121]
        - paragraph [ref=e122]: 万锦的活动分散在 Eventbrite、Luma、市政府、图书馆和社区团体。大多数信息不会告诉您有没有台阶、吵不吵、灯会不会闪，或活动结束时还有没有巴士。许多网站只有英文。人们只好猜，或者留在家里。
      - region [ref=e123]:
        - heading "TodoMarkham 如何帮助您" [level=2] [ref=e124]
        - list [ref=e125]:
          - listitem [ref=e126]:
            - heading "一个地方看全部" [level=3] [ref=e131]
            - paragraph [ref=e132]: 汇集多个来源的活动，每个都清楚标明来源和该平台上的评分。
          - listitem [ref=e133]:
            - heading "值得信赖的无障碍信息" [level=3] [ref=e137]
            - paragraph [ref=e138]: 每项无障碍信息都标明是主办方确认、我们估计，还是暂时没人知道。“暂不清楚”绝不等于“没有”。
          - listitem [ref=e139]:
            - heading "用您的语言" [level=3] [ref=e143]
            - paragraph [ref=e144]: 英语、广东话、普通话、泰米尔语和波斯语，并支持从右到左阅读。可用您的语言对 Maple 说话或打字。
          - listitem [ref=e145]:
            - heading "有车无车都能到" [level=3] [ref=e150]
            - paragraph [ref=e151]: 查看开车、坐巴士或步行所需时间、最近车站，以及活动开始时是否有车。
          - listitem [ref=e152]:
            - heading "Maple，您的活动向导" [level=3] [ref=e157]
            - paragraph [ref=e158]: 用语音或文字告诉 Maple 您喜欢什么，Maple 挑选活动并用简单的话说明原因。分数来自清楚的规则，而不是猜测。
          - listitem [ref=e159]:
            - heading "真正的社区" [level=3] [ref=e164]
            - paragraph [ref=e165]: 出发前向主办方提问，阅读参加者的真实评价，并在社区论坛里互相帮助。
      - region [ref=e166]:
        - heading "适合谁" [level=2] [ref=e167]
