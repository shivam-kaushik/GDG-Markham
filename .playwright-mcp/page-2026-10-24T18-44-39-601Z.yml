      - region [ref=e167]:
        - heading "Why you can trust it" [level=2] [ref=e168]
        - list [ref=e169]:
          - listitem [ref=e170]:
            - heading "It can only show real events" [level=3] [ref=e174]
            - paragraph [ref=e175]: Maple shows only events returned by a search tool. It cannot make one up.
          - listitem [ref=e176]:
            - heading "It never guesses a condition" [level=3] [ref=e180]
            - paragraph [ref=e181]: Maple only uses needs you state. Every item it understood appears as a chip you can remove.
          - listitem [ref=e182]:
            - heading "You can see how it decided" [level=3] [ref=e186]
            - paragraph [ref=e187]: Each answer has a "How I decided" list of the steps it took.
          - listitem [ref=e188]:
            - heading "Sample data is labelled" [level=3] [ref=e192]
            - paragraph [ref=e193]: Events, ratings, reviews and conversations in this prototype are made up. Venues are real places.
      - region [ref=e194]:
        - heading "Why it is feasible" [level=2] [ref=e195]
        - list [ref=e196]:
          - listitem [ref=e197]:
            - generic [ref=e200]: "It works today: 25 sample events, a chat guide with tools, voice, five languages and 63 passing tests."
          - listitem [ref=e201]:
            - generic [ref=e204]: It runs with no AI key. A live model is optional and only used for chat.
          - listitem [ref=e205]:
            - generic [ref=e208]: The real risk is supply of events. A pilot with libraries, community centres, temples and seniors groups addresses it.
      - region [ref=e209]:
        - heading "What we could not verify" [level=2] [ref=e210]
        - paragraph [ref=e211]: We list these so you know where the evidence stops.
        - list [ref=e212]:
          - listitem [ref=e213]: Markham-wide 2021 Census figures (visible minority share, mother tongues, share aged 65+). We only found 2016 city-wide data and a partial 2021 riding profile. We will add the exact 2021 figures from the Statistics Canada Census Profile.
          - listitem [ref=e214]: Markham-specific disability and loneliness rates. The disability and loneliness figures above are national or Ontario numbers, not Markham numbers.
          - listitem [ref=e215]: How often Markham event listings leave out accessibility details. We have no outside statistic for this, and the events in this prototype are samples, so we make no claim. A small audit of real listings is planned.
      - region [ref=e216]:
        - heading "How we will know it helps" [level=2] [ref=e217]
        - paragraph [ref=e218]: "We do not yet claim that people attend more or feel less lonely. That is what a pilot would measure:"
        - list [ref=e219]:
          - listitem [ref=e220]: How many questions people answer before they see picks
          - listitem [ref=e221]: How many events people save or attend
          - listitem [ref=e222]: How many hosts complete the accessibility checklist
          - listitem [ref=e223]: How many "Unknown" access fields hosts later confirm
      - paragraph [ref=e224]: TodoMarkham is a hackathon prototype. The events, ratings and conversations on this site are samples.
